name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: liftlogic

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: liftlogic/pnpm-lock.yaml

      # Keep CI and Cloudflare deployments on the same locked dependency tree.
      - run: pnpm install --frozen-lockfile

      # Runs `tsc && vite build`, the same script Cloudflare runs on deploy, so
      # a tree that cannot ship fails here instead of on main. Must precede the
      # tests: security-assets.test.ts asserts on the built dist/index.html.
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
